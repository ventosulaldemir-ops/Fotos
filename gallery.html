<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria de Fotos</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px; gap: 10px; }
    input { padding: 8px 12px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; width: 100%; max-width: 300px; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .card-item { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    .card-item img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card-title { padding: 8px; font-size: 0.85rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { margin-top: 20px; color: #f59e0b; text-align: center; font-weight: bold; font-size: 1.1rem; }
    .btn { padding: 8px 16px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🖼️ Galeria de Fotos</h2>
    <input type="text" id="searchInput" placeholder="🔍 Pesquisar foto..." oninput="filterPhotos()">
  </div>

  <div id="manualArea" style="display:none; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px;">
    <p style="margin-bottom: 10px;">Cole a URL do seu quadro do Trello:</p>
    <div style="display:flex; gap: 10px;">
      <input type="text" id="boardUrlInput" placeholder="https://trello.com/b/XXXX/seu-quadro" style="max-width:100%;">
      <button class="btn" onclick="manualLoad()">Carregar</button>
    </div>
  </div>

  <div id="gallery" class="grid"></div>
  <p id="status">Iniciando leitura do quadro...</p>

  <script>
    var allPhotos = [];
    var t = null;

    try {
      if (window.self !== window.top && typeof TrelloPowerUp !== 'undefined') {
        t = TrelloPowerUp.iframe();
      }
    } catch(e) {}

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    function showManualArea(msg) {
      document.getElementById('manualArea').style.display = 'block';
      setStatus(msg);
    }

    function fetchBoardPhotos(boardId) {
      setStatus('Buscando anexos de imagens do quadro...');
      fetch('https://trello.com/b/' + boardId + '.json')
        .then(function(res) {
          if (!res.ok) throw new Error('Não foi possível ler o quadro.');
          return res.json();
        })
        .then(function(data) {
          allPhotos = [];
          var cards = data.cards || [];
          cards.forEach(function(c) {
            if (c.attachments && c.attachments.length > 0) {
              c.attachments.forEach(function(att) {
                var url = att.url || '';
                var isImg = (att.mimeType && att.mimeType.indexOf('image/') === 0) || 
                            url.match(/\.(jpeg|jpg|gif|png|webp)/i) || att.bytes;
                if (isImg) {
                  allPhotos.push({ name: c.name, url: url });
                }
              });
            }
          });
          renderGallery(allPhotos);
        })
        .catch(function(err) {
          showManualArea('⚠️ Atenção: O quadro precisa estar configurado como PÚBLICO no Trello para ler as fotos.');
        });
    }

    if (t) {
      t.board('id')
        .then(function(board) {
          fetchBoardPhotos(board.id);
        })
        .catch(function() {
          showManualArea('Insira o link do quadro público abaixo:');
        });
    } else {
      showManualArea('Acesso fora do Trello. Cole o link do seu quadro público:');
    }

    function manualLoad() {
      var val = document.getElementById('boardUrlInput').value.trim();
      if (!val) return;
      var boardId = val;
      if (val.indexOf('trello.com/b/') !== -1) {
        boardId = val.split('trello.com/b/')[1].split('/')[0];
      }
      fetchBoardPhotos(boardId);
    }

    function renderGallery(photos) {
      var container = document.getElementById('gallery');
      container.innerHTML = '';
      if (photos.length === 0) {
        setStatus('Nenhuma imagem encontrada nos anexos deste quadro.');
        return;
      }
      setStatus('');
      photos.forEach(function(photo) {
        var item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = '<a href="' + photo.url + '" target="_blank"><img src="' + photo.url + '"></a><div class="card-title">' + photo.name + '</div>';
        container.appendChild(item);
      });
    }

    function filterPhotos() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var filtered = allPhotos.filter(function(p) {
        return p.name.toLowerCase().indexOf(q) !== -1;
      });
      renderGallery(filtered);
    }
  </script>
</body>
</html>
