<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria de Fotos Trello</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; background: #1e293b; padding: 15px 20px; border-radius: 12px; }
    h2 { font-size: 1.4rem; color: #38bdf8; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%; max-width: 650px; }
    input[type="text"] { flex: 1; min-width: 200px; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .card-item { background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
    .card-item img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card-title { padding: 10px; font-size: 0.85rem; color: #cbd5e1; text-align: center; }
    .status-box { background: #1e293b; border-left: 4px solid #f59e0b; padding: 15px; margin-bottom: 20px; border-radius: 6px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🖼️ Galeria de Fotos</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Pesquisar foto..." oninput="filterPhotos()">
    </div>
  </div>

  <div id="statusBox" class="status-box" style="display:none;"></div>

  <div id="manualInputArea" style="display:none; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px;">
    <p style="margin-bottom: 10px;">Cole a URL do seu quadro do Trello:</p>
    <div style="display:flex; gap: 10px; flex-wrap: wrap;">
      <input type="text" id="boardUrlInput" placeholder="https://trello.com/b/XXXXXX/seu-quadro">
      <button onclick="manualLoad()">Carregar Fotos</button>
    </div>
  </div>

  <div id="gallery" class="grid"></div>

  <script>
    var allPhotos = [];

    function showStatus(msg, isError) {
      var box = document.getElementById('statusBox');
      box.style.display = 'block';
      box.style.borderColor = isError ? '#ef4444' : '#38bdf8';
      box.innerHTML = msg;
    }

    function hideStatus() {
      document.getElementById('statusBox').style.display = 'none';
    }

    if (window.self !== window.top) {
      try {
        var t = TrelloPowerUp.iframe();
        t.render(function() {
          return t.cards('id', 'name', 'attachments')
            .then(function(cards) { processCards(cards); })
            .catch(function(err) { showStatus('Erro no Trello: ' + err.message, true); });
        });
      } catch(e) { setupOutsideTrello(); }
    } else {
      setupOutsideTrello();
    }

    function setupOutsideTrello() {
      document.getElementById('manualInputArea').style.display = 'block';
      showStatus('<b>Modo Fora do Trello:</b> Cole a URL do quadro abaixo.<br><small>Certifique-se de alterar a visibilidade do quadro no Trello para <b>Público 🌐</b>.</small>', false);
    }

    function manualLoad() {
      var input = document.getElementById('boardUrlInput').value.trim();
      if (!input) return;
      var boardId = input;
      if (input.indexOf('trello.com/b/') !== -1) {
        boardId = input.split('trello.com/b/')[1].split('/')[0];
      }

      showStatus('Buscando anexos do quadro...', false);
      
      fetch('https://api.trello.com/1/boards/' + boardId + '/cards?attachments=true')
        .then(function(res) {
          if (res.status === 401 || res.status === 404) throw new Error('AUTH_ERROR');
          return res.json();
        })
        .then(function(cards) {
          hideStatus();
          processCards(cards);
        })
        .catch(function(err) {
          if (err.message === 'AUTH_ERROR') {
            showStatus('<b>Erro de Acesso (401/404):</b> O Trello bloqueou a busca externa.<br>No Trello, mude a visibilidade do quadro de "Área de Trabalho" para <b>Público 🌐</b>.', true);
          } else {
            showStatus('Erro ao conectar com a API do Trello.', true);
          }
        });
    }

    function processCards(cards) {
      allPhotos = [];
      cards.forEach(function(card) {
        if (card.attachments && card.attachments.length > 0) {
          card.attachments.forEach(function(att) {
            var imgUrl = att.url;
            if (att.previews && att.previews.length > 0) {
              imgUrl = att.previews[att.previews.length - 1].url;
            }
            var isImg = (att.mimeType && att.mimeType.indexOf('image/') === 0) ||
                        (att.url && att.url.match(/\.(jpeg|jpg|gif|png|webp)/i)) ||
                        (att.previews && att.previews.length > 0);
            if (isImg) {
              allPhotos.push({ name: card.name || 'Sem título', url: imgUrl });
            }
          });
        }
      });
      renderGallery(allPhotos);
    }

    function renderGallery(photos) {
      var container = document.getElementById('gallery');
      container.innerHTML = '';
      if (photos.length === 0) {
        showStatus('Nenhuma foto encontrada nos anexos deste quadro.', false);
        return;
      }
      photos.forEach(function(photo) {
        var item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = '<a href="' + photo.url + '" target="_blank"><img src="' + photo.url + '"></a><div class="card-title">' + photo.name + '</div>';
        container.appendChild(item);
      });
    }

    function filterPhotos() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var filtered = allPhotos.filter(function(p) { return p.name.toLowerCase().indexOf(q) !== -1; });
      renderGallery(filtered);
    }
  </script>
</body>
</html>
